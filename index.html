<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💊 Medicine Reminder</h1>

        <div class="form">

            <input
                type="text"
                id="medicineName"
                placeholder="Medicine name"
            >

            <input
                type="text"
                id="dosage"
                placeholder="Dosage e.g. 1 Tablet"
            >

            <input
                type="time"
                id="medicineTime"
            >

            <select id="period">
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Night">Night</option>
            </select>

            <button id="addButton">
                ➕ Add Reminder
            </button>

        </div>

        <div class="stats">

            <div>
                <h3>Total</h3>
                <p id="total">0</p>
            </div>

            <div>
                <h3>Taken</h3>
                <p id="taken">0</p>
            </div>

            <div>
                <h3>Pending</h3>
                <p id="pending">0</p>
            </div>

        </div>

        <div id="reminderList"></div>

        <button id="resetButton">
            🔄 Reset All
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
